
<div class="app-shell">

  <!-- MENÚ LATERAL -->
  <aside class="sidebar">

    <div class="brand">
      <div class="brand-icon">+</div>
      <div>
        <h2>MediCitas</h2>
        <span>GESTIÓN CLÍNICA</span>
      </div>
    </div>

    <div class="menu-label">MENÚ PRINCIPAL</div>

    <nav class="navigation">

      <a class="nav-item"
         routerLink="/dashboard"
         routerLinkActive="active"
         [routerLinkActiveOptions]="{ exact: true }">
        <span class="nav-symbol">▦</span>
        <span>Dashboard</span>
      </a>

      <a class="nav-item"
         routerLink="/pacientes"
         routerLinkActive="active">
        <span class="nav-symbol">♙</span>
        <span>Pacientes</span>
      </a>

      <a class="nav-item"
         routerLink="/medicos"
         routerLinkActive="active">
        <span class="nav-symbol">⚕</span>
        <span>Médicos</span>
      </a>

      <a class="nav-item"
         routerLink="/especialidades"
         routerLinkActive="active">
        <span class="nav-symbol">✚</span>
        <span>Especialidades</span>
      </a>

      <a class="nav-item"
         routerLink="/citas"
         routerLinkActive="active">
        <span class="nav-symbol">▣</span>
        <span>Citas médicas</span>
      </a>

    </nav>

    <!-- AYUDA Y PERFIL -->
    <div class="sidebar-bottom">

      <div class="support-card">
        <div class="support-icon">?</div>
        <strong>¿Necesitas ayuda?</strong>
        <p>Consulta con el administrador del sistema.</p>
      </div>

      <div class="user-profile">
        <div class="avatar">CR</div>

        <div class="user-info">
          <strong>Carlos Rivera</strong>
          <span>Administrador</span>
        </div>

        <span class="profile-dots">⋮</span>
      </div>

    </div>

  </aside>

  <!-- CONTENIDO PRINCIPAL -->
  <div class="main-area">

    <header class="topbar">

      <div class="breadcrumb">
        Clínica <span>/</span>
        <strong>MediCitas</strong>
      </div>

      <div class="top-actions">

        <label class="search-box">
          <span>⌕</span>
          <input type="text" placeholder="Buscar...">
          <small>Ctrl K</small>
        </label>

        <button class="notification-button" type="button">
          ♧
          <i></i>
        </button>

        <div class="top-avatar">CR</div>

      </div>

    </header>

    <!-- AQUÍ SE MOSTRARÁ CADA MÓDULO -->
    <router-outlet></router-outlet>

  </div>

</div>
